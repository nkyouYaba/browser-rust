[package]
authors = ["IbukiShinzato"]
name = "rust-browser"
version = "0.1.0"
edition = "2021"

[workspace]
members = [ "core", "net/std" , "net/wasabi"]

[features]
default = ["wasabi"]
wasabi = ["dep:net_wasabi", "dep:noli"]

[[bin]]
name = "saba"
path = "src/main.rs"
required-features = ["wasabi"]

[dependencies]
core = { path = "./core" }
net_wasabi = { path = "./net/wasabi", optional = true }
noli = { git = "https://github.com/hikalium/wasabi.git", branch = "for_saba", optional = true }
